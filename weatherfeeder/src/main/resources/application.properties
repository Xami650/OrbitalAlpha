# --- Ejecucion ---
weather.mode=WEEKLY
weather.backfill.days=520
weather.producers.file=config/producers.csv
weather.source.system=weatherfeeder

# --- Broker (ActiveMQ) ---
broker.url=tcp://localhost:61616
broker.topic.weather=Weather

# --- NASA POWER API ---
nasa.api.url.template=https://power.larc.nasa.gov/api/temporal/daily/point?parameters=PRECTOTCORR,GWETROOT,T2M_MAX,T2M_MIN&community=AG&longitude=%s&latitude=%s&start=%s&end=%s&format=JSON
nasa.api.rate.limit.pause.ms=1000

# --- Planificacion ---
schedule.collection.interval.hours=24
schedule.window.days=7
schedule.expected.days=7